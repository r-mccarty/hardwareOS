syntax = "proto3";

package native;

option go_package = "github.com/jetkvm/kvm/targets/rv1106/native/proto";

// NativeService provides methods to interact with the native layer
service NativeService {
  // Ready check
  rpc IsReady(IsReadyRequest) returns (IsReadyResponse);

  // Video methods
  rpc VideoSetSleepMode(VideoSetSleepModeRequest) returns (Empty);
  rpc VideoGetSleepMode(Empty) returns (VideoGetSleepModeResponse);
  rpc VideoSleepModeSupported(Empty) returns (VideoSleepModeSupportedResponse);
  rpc VideoSetQualityFactor(VideoSetQualityFactorRequest) returns (Empty);
  rpc VideoGetQualityFactor(Empty) returns (VideoGetQualityFactorResponse);
  rpc VideoSetEDID(VideoSetEDIDRequest) returns (Empty);
  rpc VideoGetEDID(Empty) returns (VideoGetEDIDResponse);
  rpc VideoLogStatus(Empty) returns (VideoLogStatusResponse);
  rpc VideoStop(Empty) returns (Empty);
  rpc VideoStart(Empty) returns (Empty);

  // UI methods
  rpc GetLVGLVersion(Empty) returns (GetLVGLVersionResponse);
  rpc UIObjHide(UIObjHideRequest) returns (UIObjHideResponse);
  rpc UIObjShow(UIObjShowRequest) returns (UIObjShowResponse);
  rpc UISetVar(UISetVarRequest) returns (Empty);
  rpc UIGetVar(UIGetVarRequest) returns (UIGetVarResponse);
  rpc UIObjAddState(UIObjAddStateRequest) returns (UIObjAddStateResponse);
  rpc UIObjClearState(UIObjClearStateRequest) returns (UIObjClearStateResponse);
  rpc UIObjAddFlag(UIObjAddFlagRequest) returns (UIObjAddFlagResponse);
  rpc UIObjClearFlag(UIObjClearFlagRequest) returns (UIObjClearFlagResponse);
  rpc UIObjSetOpacity(UIObjSetOpacityRequest) returns (UIObjSetOpacityResponse);
  rpc UIObjFadeIn(UIObjFadeInRequest) returns (UIObjFadeInResponse);
  rpc UIObjFadeOut(UIObjFadeOutRequest) returns (UIObjFadeOutResponse);
  rpc UIObjSetLabelText(UIObjSetLabelTextRequest) returns (UIObjSetLabelTextResponse);
  rpc UIObjSetImageSrc(UIObjSetImageSrcRequest) returns (UIObjSetImageSrcResponse);
  rpc DisplaySetRotation(DisplaySetRotationRequest) returns (DisplaySetRotationResponse);
  rpc UpdateLabelIfChanged(UpdateLabelIfChangedRequest) returns (Empty);
  rpc UpdateLabelAndChangeVisibility(UpdateLabelAndChangeVisibilityRequest) returns (Empty);
  rpc SwitchToScreenIf(SwitchToScreenIfRequest) returns (Empty);
  rpc SwitchToScreenIfDifferent(SwitchToScreenIfDifferentRequest) returns (Empty);

  // Testing
  rpc DoNotUseThisIsForCrashTestingOnly(Empty) returns (Empty);

  // Events stream
  rpc StreamEvents(Empty) returns (stream Event);

  // ==========================================================================
  // RS-1 Vision Pipeline Methods
  // ==========================================================================

  // Vision pipeline control
  rpc VisionPipelineStart(Empty) returns (Empty);
  rpc VisionPipelineStop(Empty) returns (Empty);
  rpc VisionPipelineGetState(Empty) returns (VisionPipelineState);

  // Camera control
  rpc CameraSetExposure(CameraSetExposureRequest) returns (Empty);
  rpc CameraSetOrientation(CameraSetOrientationRequest) returns (Empty);

  // ISP control
  rpc IspSetLdchEnabled(IspSetLdchEnabledRequest) returns (Empty);
  rpc IspSetLdchLevel(IspSetLdchLevelRequest) returns (Empty);

  // NPU control
  rpc NpuLoadModel(NpuLoadModelRequest) returns (Empty);
  rpc NpuSetConfidenceThreshold(NpuSetConfidenceThresholdRequest) returns (Empty);
}

// Messages
message Empty {}

message IsReadyRequest {}

message IsReadyResponse {
  bool ready = 1;
  string error = 2;
  bool video_ready = 3;
}

message VideoState {
  bool ready = 1;
  string error = 2;
  int32 width = 3;
  int32 height = 4;
  double frame_per_second = 5;
}

message VideoSetSleepModeRequest {
  bool enabled = 1;
}

message VideoGetSleepModeResponse {
  bool enabled = 1;
}

message VideoSleepModeSupportedResponse {
  bool supported = 1;
}

message VideoSetQualityFactorRequest {
  double factor = 1;
}

message VideoGetQualityFactorResponse {
  double factor = 1;
}

message VideoSetEDIDRequest {
  string edid = 1;
}

message VideoGetEDIDResponse {
  string edid = 1;
}

message VideoLogStatusResponse {
  string status = 1;
}

message GetLVGLVersionResponse {
  string version = 1;
}

message UIObjHideRequest {
  string obj_name = 1;
}

message UIObjHideResponse {
  bool success = 1;
}

message UIObjShowRequest {
  string obj_name = 1;
}

message UIObjShowResponse {
  bool success = 1;
}

message UISetVarRequest {
  string name = 1;
  string value = 2;
}

message UIGetVarRequest {
  string name = 1;
}

message UIGetVarResponse {
  string value = 1;
}

message UIObjAddStateRequest {
  string obj_name = 1;
  string state = 2;
}

message UIObjAddStateResponse {
  bool success = 1;
}

message UIObjClearStateRequest {
  string obj_name = 1;
  string state = 2;
}

message UIObjClearStateResponse {
  bool success = 1;
}

message UIObjAddFlagRequest {
  string obj_name = 1;
  string flag = 2;
}

message UIObjAddFlagResponse {
  bool success = 1;
}

message UIObjClearFlagRequest {
  string obj_name = 1;
  string flag = 2;
}

message UIObjClearFlagResponse {
  bool success = 1;
}

message UIObjSetOpacityRequest {
  string obj_name = 1;
  int32 opacity = 2;
}

message UIObjSetOpacityResponse {
  bool success = 1;
}

message UIObjFadeInRequest {
  string obj_name = 1;
  uint32 duration = 2;
}

message UIObjFadeInResponse {
  bool success = 1;
}

message UIObjFadeOutRequest {
  string obj_name = 1;
  uint32 duration = 2;
}

message UIObjFadeOutResponse {
  bool success = 1;
}

message UIObjSetLabelTextRequest {
  string obj_name = 1;
  string text = 2;
}

message UIObjSetLabelTextResponse {
  bool success = 1;
}

message UIObjSetImageSrcRequest {
  string obj_name = 1;
  string image = 2;
}

message UIObjSetImageSrcResponse {
  bool success = 1;
}

message DisplaySetRotationRequest {
  uint32 rotation = 1;
}

message DisplaySetRotationResponse {
  bool success = 1;
}

message UpdateLabelIfChangedRequest {
  string obj_name = 1;
  string new_text = 2;
}

message UpdateLabelAndChangeVisibilityRequest {
  string obj_name = 1;
  string new_text = 2;
}

message SwitchToScreenIfRequest {
  string screen_name = 1;
  repeated string should_switch = 2;
}

message SwitchToScreenIfDifferentRequest {
  string screen_name = 1;
}

message Event {
  string type = 1;
  oneof data {
    VideoState video_state = 2;
    string indev_event = 3;
    string rpc_event = 4;
    VideoFrame video_frame = 5;
    VisionFrame vision_frame = 6;           // RS-1: NPU detections
    VisionPipelineState vision_state = 7;   // RS-1: Pipeline status
  }
}

message VideoFrame {
  bytes frame = 1;
  int64 duration_ns = 2;
}

// =============================================================================
// RS-1 Vision Pipeline Messages
// =============================================================================

// Vision detection from NPU (YOLOv8)
message VisionDetection {
  // Tracking ID assigned by fusion engine (0 = unassigned)
  int32 track_id = 1;

  // Bounding box (normalized 0-1)
  float bbox_x = 2;       // Center X
  float bbox_y = 3;       // Center Y
  float bbox_width = 4;   // Width
  float bbox_height = 5;  // Height

  // Classification
  int32 class_id = 6;     // Object class (COCO: 0=person, 2=car, etc.)
  float confidence = 7;   // Detection confidence (0-1)

  // Angular position (calculated from LDCH-corrected image)
  float azimuth_deg = 8;    // Horizontal angle from camera center
  float elevation_deg = 9;  // Vertical angle from camera center
}

// Frame of detections from NPU
message VisionFrame {
  // Array of detections in this frame
  repeated VisionDetection detections = 1;

  // Timing
  int64 timestamp_ns = 2;   // Frame timestamp (nanoseconds since epoch)
  int32 frame_number = 3;   // Monotonic frame counter
  int32 inference_ms = 4;   // NPU inference time in milliseconds
}

// Camera status
message CameraState {
  bool initialized = 1;
  bool streaming = 2;
  int32 width = 3;
  int32 height = 4;
  int32 fps = 5;
  uint64 frame_count = 6;
  string error = 7;
}

// ISP status
message IspState {
  bool initialized = 1;
  bool running = 2;
  bool ldch_enabled = 3;
  int32 ldch_level = 4;   // 0-255
  float exposure_time_ms = 5;
  float gain = 6;
  int32 color_temp_k = 7;
}

// NPU status
message NpuState {
  bool initialized = 1;
  bool model_loaded = 2;
  string model_path = 3;
  int32 input_width = 4;
  int32 input_height = 5;
  uint64 inference_count = 6;
  float avg_inference_ms = 7;
}

// Vision pipeline aggregate status
message VisionPipelineState {
  CameraState camera = 1;
  IspState isp = 2;
  NpuState npu = 3;
  bool pipeline_running = 4;
}

// =============================================================================
// RS-1 Vision Pipeline Request Messages
// =============================================================================

message CameraSetExposureRequest {
  bool auto_exposure = 1;
  int32 manual_value = 2;  // Ignored if auto_exposure is true
}

message CameraSetOrientationRequest {
  bool mirror = 1;  // Horizontal flip
  bool flip = 2;    // Vertical flip
}

message IspSetLdchEnabledRequest {
  bool enabled = 1;
}

message IspSetLdchLevelRequest {
  int32 level = 1;  // 0-255, 255 = full cylindrical projection
}

message NpuLoadModelRequest {
  string model_path = 1;
}

message NpuSetConfidenceThresholdRequest {
  float threshold = 1;  // 0.0-1.0
}

// =============================================================================
// RS-1 WorldState Streaming Messages
// =============================================================================

// TrackedObject represents a single tracked entity after sensor fusion
message TrackedObject {
  // Unique track ID (stable across frames)
  int32 track_id = 1;

  // Position in room coordinates (meters)
  float x = 2;
  float y = 3;

  // Velocity (meters/second)
  float vx = 4;
  float vy = 5;

  // Classification
  int32 class_id = 6;     // -1=unknown, 0=person, 1=vehicle, 2=animal
  float confidence = 7;   // Detection confidence (0.0-1.0)

  // Sensor contribution
  bool is_radar_only = 8;   // True if only radar detects this object
  bool is_vision_only = 9;  // True if only camera detects this object

  // Derived motion
  float heading = 10;  // Movement direction (degrees, 0=+Y/forward)
  float speed = 11;    // Speed magnitude (m/s)
}

// WorldStateProto represents the complete tracked environment
message WorldStateProto {
  // All currently tracked objects
  repeated TrackedObject objects = 1;

  // Timing
  int64 timestamp_ns = 2;    // Unix nanoseconds
  uint64 frame_number = 3;   // Monotonic frame counter

  // Sensor diagnostics
  int32 radar_targets = 4;      // Raw radar target count
  int32 vision_detections = 5;  // Raw vision detection count
  float fusion_latency_ms = 6;  // Processing latency
}
